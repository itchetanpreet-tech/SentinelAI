services:
  api:
    build: .
    ports:
      - "8002:8000"
    environment:
      SENTINELAI_DB_PATH: /app/data/predictions.db
    volumes:
      - sentinelai_data:/app/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  sentinelai_data:
  prometheus_data:
  grafana_data:
